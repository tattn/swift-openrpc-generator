name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        run: |
          VERSION="v${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION' (expected semver such as 0.2.0)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Test
        run: swift test

      - name: Build universal binary
        run: swift build --configuration release --arch arm64 --arch x86_64

      - name: Package binary
        run: |
          BINARY=.build/apple/Products/Release/swift-openrpc-generator
          tar -czf "swift-openrpc-generator-$VERSION-macos.tar.gz" -C "$(dirname "$BINARY")" swift-openrpc-generator

      # Everything above must pass before the tag exists, so a failing build can
      # never leave a broken tag behind.
      - name: Create tag
        id: tag
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Compute checksums
        run: |
          ASSET="swift-openrpc-generator-$VERSION-macos.tar.gz"
          SHA256="$(shasum -a 256 "$ASSET" | cut -d" " -f1)"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          {
            echo '## Checksums'
            echo
            echo '```'
            echo "$SHA256  $ASSET"
            echo '```'
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "swift-openrpc-generator-$VERSION-macos.tar.gz"

      # The formula points at the release asset, so it can only be bumped once the
      # release exists.
      - name: Update Homebrew formula
        run: |
          FORMULA=Formula/swift-openrpc-generator.rb
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/swift-openrpc-generator-$VERSION-macos.tar.gz"
          # Anchoring on the two-space indent keeps the `head` block's url untouched.
          sed -i "" -E \
            -e "s|^  url \".*\"|  url \"$URL\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            "$FORMULA"
          grep -qF "url \"$URL\"" "$FORMULA" || { echo "::error::Failed to update url in $FORMULA"; exit 1; }
          grep -qF "sha256 \"$SHA256\"" "$FORMULA" || { echo "::error::Failed to update sha256 in $FORMULA"; exit 1; }
          if git diff --quiet -- "$FORMULA"; then
            echo "$FORMULA is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Homebrew formula to $VERSION" -- "$FORMULA"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Delete tag on failure
        if: failure() && steps.tag.outcome == 'success'
        run: |
          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
