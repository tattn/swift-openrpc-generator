name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Generated code end-to-end check
        run: ./scripts/e2e-check.sh

  lint:
    name: Lint (swift format)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests scripts Package.swift

  e2e:
    name: Generated code end-to-end check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Generate, compile, and run the Petstore client against a mock
        run: ./scripts/e2e-check.sh
